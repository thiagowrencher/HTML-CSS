<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /* # = id
           . = class
           : = pseudo-class
           :: = pseudo-element
           > = clildren (filho)
           */

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: rgb(241, 14, 14);
            text-decoration: none;
            font-weight: bold;
        }
          a:visited{
            color: rgb(9, 119, 119);
           
          }   /* cor alterado quando link ja foi visitaddo*/

        a:hover{
            color: blueviolet;
            text-decoration: underline;
        }   /* Quando passa o mouse por cima altera a cor*/

        
        a:active{
            color: yellow;
        } /* Quando clica ele altera a cor*/
        

        .especial{
            background-color: aquamarine;
        }
        .especial::before{
            content: '►';
        }

        .especial::after{
            content: '[◄]';
            text-decoration: none;
            font-weight: normal;
            
                }


    </style>
</head>
<body>
    <h1>Personalizando um Link</h1>
    <p>
      Para aprender HTMLe CSS3, acess o 
      <a href="https://gustavoguanabara.github.io" target="_blank">    
           Github Guamabara
      </a>
    </p>
    <P>
        Se quiser conhecer sobre os padrões, visite o site do 
       <a href="http:www.w3c.br" target="_blank">Escritório do W3C mp Brasil </a>
    </P>
    <P>Para acompanhar os cursos, acesse o 
      <a href="http:www.youtube.com/cursoemvideo/" class="especial", target="_blank">canal do curso em video        </a>

    </P>
</body>
</html>
