<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Mídias em HTML</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>tente abrir esse site em varios dispositvos ou simplesmente aumente e diminua o tamanho do seu navegador</h1>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png">
        <img src="imagens/foto-g.png" alt="A imagem flex funciona" srcset="">
    </picture>
    
    <h1>Reproduzindo Aúdio</h1>
    <p>Vamos aprender a reproduizr os audios em html5</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/jazz.mp3" type="audio/mpeg">
        <source src="midia/jazz.mp3" type="audio/ogg">
        <source src="midia/jazz.mp3" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir ete aúdio
        <a href="midia/jazz.mp3"> Clique aqui para baixar o arquivo</a></p>
    </audio>

    
</body>
</html>
