<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com html 5</title>
</head>
<body>
    <h1>Adcionando Vídeos hospedados localmente/h1>
    <p>Este video está hospedado no meu proprio servidor</p>
    <video src="midia/meu-video.mp4" width="500"controls></video>
  <hr>
    <p>Adcionando Vídeos com a source para varios tipos- localmente</p>
    <video width="560" poster="imagem/limoes-capa.png" controls muted autoplay loop>
     <source src="midia/meu-video.mp4" type="video/mp4">
     <source src="midia/meu-video.m4v" type="video/m4v">
     <source src="midia/meu-video.ogv" type="video/ogv">
     <source src="midia/meu-video.webm" type="video/webm">
     <p>Seu navegador não tem compatibilidade para reproduzir este video</p>
    </video>
    <hr>
    <h1>Inserindo videos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3hng-hmSv2Y?si=SO_QuroyTJ5b_IHH" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>6
</body>
</html>
